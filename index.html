<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DEMOOD</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#f0eeea;font-family:'Inter',sans-serif;font-weight:300;min-height:100vh;overflow-x:hidden}

/* HEADER */
.header{padding:20px 18px 8px;background:#f0eeea}
.header-logo{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:700;letter-spacing:6px;color:#111}
.header-sub{font-size:10px;letter-spacing:3px;color:#999;margin-top:2px;text-transform:uppercase}

/* CATALOG PAGE */
.page{display:none}
.page.active{display:block}

/* CATEGORY CARDS */
.cat-list{padding:10px 14px 24px}
.cat-card{
  background:#fff;border-radius:14px;
  margin-bottom:10px;padding:22px 20px;
  display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;transition:transform .15s;
  border:1px solid #e8e6e2;
}
.cat-card:active{transform:scale(.98)}
.cat-card-left{flex:1}
.cat-card-title{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:700;color:#111;letter-spacing:1px;margin-bottom:4px}
.cat-card-desc{font-size:12px;color:#888;line-height:1.5;margin-bottom:12px}
.cat-card-arrow{font-size:18px;color:#333}
.cat-card-icon{
  width:90px;height:90px;background:#f5f3f0;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:38px;
  margin-left:16px;flex-shrink:0;
}

/* BACK BTN */
.back-btn{
  display:flex;align-items:center;gap:8px;
  padding:14px 18px 0;font-size:13px;color:#555;cursor:pointer;
  background:none;border:none;font-family:'Inter',sans-serif;
}
.back-btn:active{opacity:.6}
.page-title{
  font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:700;
  letter-spacing:2px;color:#111;padding:8px 18px 14px;
}

/* ITEMS GRID */
.items-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:10px;padding:0 14px 24px;
}
.item-card{background:#fff;border-radius:12px;overflow:hidden;cursor:pointer;border:1px solid #e8e6e2}
.item-card:active{opacity:.85}
.item-img-wrap{width:100%;aspect-ratio:3/4;background:#f5f3f0;position:relative;overflow:hidden}
.item-img{width:100%;height:100%;object-fit:cover;display:block}
.item-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:40px}
.item-body{padding:10px 11px 12px}
.item-name{font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:600;color:#111;line-height:1.2;margin-bottom:4px}

.item-btns{display:flex;gap:6px}
.btn-tryon{flex:1;background:#111;color:#fff;border:none;padding:8px 4px;font-size:9px;font-weight:500;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border-radius:4px}
.btn-download{background:#f0eeea;border:1px solid #e0ddd8;color:#555;padding:8px 10px;font-size:14px;cursor:pointer;border-radius:4px;display:flex;align-items:center;justify-content:center}

/* ITEM MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;align-items:flex-end}
.modal-bg.open{display:flex}
.modal{background:#fff;width:100%;max-height:90vh;overflow-y:auto;border-radius:16px 16px 0 0}
.modal-handle{width:36px;height:3px;background:#ddd;border-radius:2px;margin:12px auto 0}
.modal-img-big{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#f5f3f0}
.modal-img-placeholder{width:100%;aspect-ratio:3/4;background:#f5f3f0;display:flex;align-items:center;justify-content:center;font-size:80px}
.modal-info{padding:18px 18px 28px}
.modal-cat-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#999;margin-bottom:6px}
.modal-name{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:700;color:#111;margin-bottom:6px;line-height:1.2}

.modal-action-row{display:flex;gap:10px}
.modal-btn-tryon{flex:1;background:#111;color:#fff;border:none;padding:15px;font-size:11px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;border-radius:6px}
.modal-btn-download{background:#f0eeea;border:1px solid #e0ddd8;color:#333;padding:15px 18px;font-size:18px;cursor:pointer;border-radius:6px}
.modal-btn-close{background:none;border:1px solid #e0ddd8;color:#888;padding:15px 16px;cursor:pointer;border-radius:6px;font-size:14px}

/* EMPTY */
.empty{text-align:center;padding:50px 20px;grid-column:1/-1}
.empty-icon{font-size:44px;margin-bottom:14px}
.empty-t{font-family:'Cormorant Garamond',serif;font-size:22px;color:#111;margin-bottom:6px}
.empty-s{font-size:12px;color:#999}

.catalog-header{display:flex;align-items:center;justify-content:space-between;padding:4px 18px 10px}
.items-count{font-size:11px;color:#999;letter-spacing:.5px}
</style>
</head>
<body>

<!-- MAIN PAGE: категории -->
<div class="page active" id="pageMain">
  <div class="header">
    <div class="header-logo">DEMOOD</div>
    <div class="header-sub">Каталог одягу</div>
  </div>
  <div class="cat-list" id="catList">
    <div style="text-align:center;padding:40px;color:#999;font-size:13px">Завантаження...</div>
  </div>
</div>

<!-- ITEMS PAGE: товары категории -->
<div class="page" id="pageItems">
  <button class="back-btn" onclick="goBack()">← Назад</button>
  <div class="catalog-header">
    <div class="page-title" id="pageTitle">Категорія</div>
    <div class="items-count" id="itemsCount"></div>
  </div>
  <div class="items-grid" id="itemsGrid"></div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modal" onclick="closeBg(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div id="mImgWrap"></div>
    <div class="modal-info">
      <div class="modal-cat-label" id="mCat"></div>
      <div class="modal-name" id="mName"></div>
      
      <div class="modal-action-row">
        
        <button class="modal-btn-download" id="mBtnDownload" title="Завантажити фото">⬇</button>
        <button class="modal-btn-close" onclick="closeModal()">✕</button>
      </div>
    </div>
  </div>
</div>

<script>
const tg=window.Telegram.WebApp;
tg.expand();tg.ready();

const CATS=[
  {key:'Майка',icon:'👕',desc:'Базова та зручна на кожен день.'},
  {key:'Футболка',icon:'👕',desc:'Лаконічні та зручні на кожен день.'},
  {key:'Топ',icon:'👚',desc:'Легкий та стильний образ.'},
  {key:'Боді',icon:'🩱',desc:'Підкреслює силует.'},
  {key:'Куртка',icon:'🧥',desc:'Захист та стиль в одному.'},
  {key:'Кардиган',icon:'🧣',desc:'М\'який та затишний.'},
  {key:'Вітровка',icon:'🧥',desc:'Легка захист від вітру.'},
  {key:'Лонг',icon:'👕',desc:'Подовжений крій для комфорту.'},
  {key:'Светр',icon:'🧥',desc:'Тепло та стиль.'},
  {key:'Жилетка',icon:'🦺',desc:'Додають форми. Залишають стиль.'},
  {key:'Сорочка',icon:'👔',desc:'Стиль у деталях. Підкресли образ.'},
  {key:'Сукня',icon:'👗',desc:'Елегантність на кожен вихід.'},
  {key:'Спідниця',icon:'👗',desc:'Жіночність та свобода.'},
  {key:'Комбінезон',icon:'🦱',desc:'Готовий образ за секунду.'},
  {key:'Шорти',icon:'🩳',desc:'Легкість та комфорт.'},
  {key:'Джинси',icon:'👖',desc:'Класика, яка завжди в тренді.'},
  {key:'Костюм',icon:'👔',desc:'Діловий та стильний образ.'},
  {key:'Піджак',icon:'🧥',desc:'Завершує будь-який образ.'},
  {key:'Брюки',icon:'👖',desc:'Ідеальна посадка та стиль.'},
  {key:'Спорт штани',icon:'🩲',desc:'Комфорт для активного дня.'},
  {key:'Лосини',icon:'🩲',desc:'Свобода руху та стиль.'},
  {key:'Гольф',icon:'🧤',desc:'Класика та тепло.'},
];

let allItems=[];
let currentCat='';
let selectedItem=null;

async function load(){
  try{
    const apiBase='https://demood-bot.onrender.com';
    const r=await fetch(apiBase+'/catalog');
    allItems=await r.json();
  }catch(e){allItems=[];}
  renderCats();
}

function renderCats(){
  const list=document.getElementById('catList');
  const cards=CATS.map(c=>{
    const count=allItems.filter(i=>i.category===c.key).length;
    if(count===0&&allItems.length>0) return '';
    return `
    <div class="cat-card" onclick="openCat('${c.key}','${c.icon}')">
      <div class="cat-card-left">
        <div class="cat-card-title">${c.key.toUpperCase()}</div>
        <div class="cat-card-desc">${c.desc}${count>0?`<br><span style="color:#bbb;font-size:11px">${count} товар${count===1?'':count<5?'и':'ів'}</span>`:''}</div>
        <div class="cat-card-arrow">→</div>
      </div>
      <div class="cat-card-icon">${c.icon}</div>
    </div>`;
  }).filter(Boolean).join('');
  list.innerHTML=cards||'<div style="text-align:center;padding:40px;color:#999;font-size:13px">Каталог поки порожній</div>';
}

function openCat(cat,icon){
  currentCat=cat;
  document.getElementById('pageTitle').textContent=cat.toUpperCase();
  document.getElementById('pageMain').classList.remove('active');
  document.getElementById('pageItems').classList.add('active');
  window.scrollTo(0,0);
  renderItems();
}

function goBack(){
  document.getElementById('pageItems').classList.remove('active');
  document.getElementById('pageMain').classList.add('active');
  window.scrollTo(0,0);
}

function renderItems(){
  const items=allItems.filter(i=>i.category===currentCat);
  document.getElementById('itemsCount').textContent=items.length+' товар'+(items.length===1?'':items.length<5?'и':'ів');
  const grid=document.getElementById('itemsGrid');
  if(!items.length){
    grid.innerHTML='<div class="empty"><div class="empty-icon">🛍</div><div class="empty-t">Поки порожньо</div><div class="empty-s">Товари незабаром з\'являться</div></div>';
    return;
  }
  grid.innerHTML=items.map(i=>`
    <div class="item-card">
      <div class="item-img-wrap" onclick="openModal(${i.id})">
        ${i.photo_url
          ?`<img class="item-img" src="${i.photo_url}" alt="${i.name}" loading="lazy">`
          :`<div class="item-placeholder">👗</div>`}
      </div>
      <div class="item-body">
        <div class="item-name">${i.name}</div>
        
        <button style="width:100%;padding:9px;border-radius:4px;background:#111;color:#fff;border:none;font-size:11px;font-weight:500;letter-spacing:1px;cursor:pointer" onclick="downloadPhoto('${i.photo_url||''}','${i.name}',${i.id})">⬇ Завантажити фото</button>
      </div>
    </div>`).join('');
}

function openModal(id){
  const items=allItems.filter(i=>i.category===currentCat);
  selectedItem=items.find(i=>i.id===id);
  if(!selectedItem)return;
  document.getElementById('mCat').textContent=selectedItem.category;
  document.getElementById('mName').textContent=selectedItem.name;
  
  document.getElementById('mImgWrap').innerHTML=selectedItem.photo_url
    ?`<img class="modal-img-big" src="${selectedItem.photo_url}" alt="${selectedItem.name}">`
    :`<div class="modal-img-placeholder">👗</div>`;
        <button class="modal-btn-tryon" id="mBtnDownload">⬇ Завантажити фото</button>
  document.getElementById('modal').classList.add('open');
}

function closeBg(e){if(e.target===document.getElementById('modal'))closeModal();}
function closeModal(){document.getElementById('modal').classList.remove('open');}

function tryOn(id){
  const item=allItems.find(i=>i.id===id)||selectedItem;
  closeModal();
  tg.sendData(JSON.stringify({action:'tryon',item_id:item?item.id:id,item_name:item?item.name:''}));
}

function downloadPhoto(url,name,id){
  if(!url){alert('Фото недоступне');return;}
  // Відправляємо боту щоб він прислав фото в чат
  try{
    tg.sendData(JSON.stringify({action:'send_photo',item_id:id,item_name:name}));
  }catch(e){
    // Якщо не працює через бота - просто відкриваємо фото
    window.open(url,'_blank');
  }
}

load();
</script>
</body>
</html>
